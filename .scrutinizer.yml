# Только static analysis. Тесты/coverage — GitHub Actions (Quality) и Qlty.
# Нода tests на Scrutinizer стабильно даёт build=error (очередь/окружение).
build:
  nodes:
    analysis:
      tests:
        override:
          - php-scrutinizer-run

checks:
  php: true

filter:
  excluded_paths:
    - 'tests/*'
    - 'tools/*'
    - 'vendor/*'
