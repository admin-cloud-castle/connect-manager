build:
  nodes:
    analysis:
      tests:
        override:
          - php-scrutinizer-run
    tests:
      environment:
        php:
          version: '8.3'
      tests:
        override:
          # Только PHPUnit: coverage собирает GitHub Actions/Qlty.
          # pecl pcov на Scrutinizer часто зависает в очереди; composer test:coverage без драйвера = build error.
          - vendor/bin/phpunit

checks:
  php: true

filter:
  excluded_paths:
    - 'tests/*'
    - 'tools/*'
    - 'vendor/*'
