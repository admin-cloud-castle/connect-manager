# Analysis на Scrutinizer; coverage приходит из GitHub Actions (ocular + clover).
build:
  nodes:
    analysis:
      tests:
        override:
          - php-scrutinizer-run

tools:
  external_code_coverage:
    # Quality: lint + SA + phpunit до upload; запас на очередь Actions.
    timeout: 1200

checks:
  php: true

filter:
  excluded_paths:
    - 'tests/*'
    - 'tools/*'
    - 'vendor/*'
