name: Attest release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM (placeholder)
        run: |
          mkdir -p var/sbom
          printf '%s\n' '{"bomFormat":"CycloneDX","specVersion":"1.5","components":[]}' > var/sbom/bom.json

      - name: Attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: var/sbom/bom.json
