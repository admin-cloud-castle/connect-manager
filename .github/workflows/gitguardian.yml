name: GitGuardian

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scanning:
    name: GitGuardian scan
    runs-on: ubuntu-latest
    env:
      GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: GitGuardian scan
        if: ${{ env.GITGUARDIAN_API_KEY != '' }}
        uses: GitGuardian/ggshield-action@v1.40.0
        continue-on-error: true
      - name: Skip notice
        if: ${{ env.GITGUARDIAN_API_KEY == '' }}
        run: echo "GITGUARDIAN_API_KEY не задан — мониторинг через GitHub App в dashboard"
