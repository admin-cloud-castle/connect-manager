name: Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Quality]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - run: composer install --prefer-dist --no-progress --no-interaction --no-dev || composer install --prefer-dist --no-progress --no-interaction

      - name: Build site
        run: |
          mkdir -p site
          # Покрытие — Coveralls, не coverage.json на custom domain.
          printf '%s\n' "<!DOCTYPE html><html lang=\"ru\"><head><meta charset=\"utf-8\"><title>${{ github.repository }}</title></head><body><h1>${{ github.repository }}</h1><p>Документация появится после phpDocumentor.</p><p>Coverage: <a href=\"https://coveralls.io/github/${{ github.repository }}\">Coveralls</a></p></body></html>" > site/index.html
          if [[ -f CNAME ]]; then
            # В корне CNAME может быть host/path; в артефакт Pages — только hostname.
            sed 's|/.*||' CNAME > site/CNAME
          fi
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
