name: Publish Wiki

on:
  push:
    paths: ['wiki/**']
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Publish wiki/
        uses: Andrew-Chen-Wang/github-wiki-action@50650fccf3a10f741995523cf9708c53cec8912a # v4
        with:
          path: wiki
        env:
          GH_TOKEN: ${{ github.token }}
          WIKI_DIR: wiki
