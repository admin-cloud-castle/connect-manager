name: Publish Wiki

on:
  push:
    paths: ['wiki/**']
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Publish wiki/
        uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          path: wiki
        env:
          GH_TOKEN: ${{ github.token }}
          WIKI_DIR: wiki
