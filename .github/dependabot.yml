version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - ci

  # github-actions: не открываем PR — workflows pinned на commit SHA.
  # Обновление actions — вручную / в скаффолдере (60-ci.sh).
